name: Build Game Turbo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Game Turbo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: read_version
        run: |
          echo "=== Step 1: Reading APP_VERSION from version.properties ==="
          if [ ! -f "version.properties" ]; then
            echo "::error::Missing version.properties file in repository root!"
            exit 1
          fi

          APP_VERSION=$(grep -E '^APP_VERSION=' version.properties | cut -d '=' -f 2 | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            echo "::error::APP_VERSION not found or empty in version.properties!"
            exit 1
          fi

          if ! [[ "$APP_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APP_VERSION '$APP_VERSION' is not a valid positive integer!"
            exit 1
          fi

          echo "Detected APP_VERSION: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Restore permanent signing keystore
        run: |
          echo "=== Step 2: Restoring Permanent Signing Keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored ./debug.keystore from debug.keystore.base64"
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "::error::debug.keystore is missing or empty!"
            exit 1
          fi

          # Install in ~/.android/debug.keystore so any standard toolchain uses the permanent key
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "Permanent keystore placed in project root and ~/.android/debug.keystore"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          echo "=== Step 3: Compiling Game Turbo APK ==="
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Standardize and Verify APK
        id: verify_apk
        run: |
          echo "=== Step 4: Standardizing APK Output Name and Verifying Signatures ==="
          APP_VER="${{ steps.read_version.outputs.app_version }}"
          OUTPUT_DIR="app/build/outputs/apk/debug"
          TARGET_NAME="Game-Turbo-v${APP_VER}.apk"
          TARGET_PATH="$OUTPUT_DIR/$TARGET_NAME"

          SOURCE_APK=$(find "$OUTPUT_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::No compiled APK found in $OUTPUT_DIR!"
            ls -R app/build/outputs || true
            exit 1
          fi

          if [ "$SOURCE_APK" != "$TARGET_PATH" ]; then
            cp "$SOURCE_APK" "$TARGET_PATH"
          fi

          FILE_SIZE=$(stat -c%s "$TARGET_PATH" 2>/dev/null || wc -c < "$TARGET_PATH")
          SHA256_HASH=$(sha256sum "$TARGET_PATH" | awk '{print $1}')

          echo "----------------------------------------"
          echo "Final APK   : $TARGET_NAME"
          echo "Path        : $TARGET_PATH"
          echo "Size        : $FILE_SIZE bytes"
          echo "SHA-256     : $SHA256_HASH"
          echo "----------------------------------------"

          # Verify signature with apksigner if available in Android SDK
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK with apksigner ($APKSIGNER)..."
            "$APKSIGNER" verify -v --print-certs "$TARGET_PATH" || echo "apksigner verification warning"
          fi

          echo "apk_path=$TARGET_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$TARGET_NAME" >> $GITHUB_OUTPUT

      - name: Upload Game Turbo APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Turbo-v${{ steps.read_version.outputs.app_version }}
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Step 5: Publishing Game Turbo to GitHub Releases ==="
          APP_VER="${{ steps.read_version.outputs.app_version }}"
          RELEASE_TAG="v$APP_VER"
          RELEASE_TITLE="Game Turbo v$APP_VER"
          ASSET_FILE="${{ steps.verify_apk.outputs.apk_path }}"
          ASSET_NAME="${{ steps.verify_apk.outputs.apk_name }}"

          NOTES=$(cat <<EOF
          ### Game Turbo v$APP_VER Official Release
          - **File Name:** \`$ASSET_NAME\`
          - **Version:** \`v$APP_VER\`
          - **Signing:** Permanent Signature (Supports seamless in-place install over previous versions)
          - **Architecture:** Universal Android (API 29+)
          - **Source Commit:** ${{ github.sha }}
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$ASSET_FILE#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest || gh release upload "$RELEASE_TAG" "$ASSET_FILE#$ASSET_NAME" --clobber

      - name: Report APK download result
        if: always()
        run: |
          echo "=== Step 6: Download Summary ==="
          APP_VER="${{ steps.read_version.outputs.app_version }}"
          ASSET_NAME="${{ steps.verify_apk.outputs.apk_name }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/download/v$APP_VER/$ASSET_NAME"
          LATEST_URL="https://github.com/${{ github.repository }}/releases/latest/download/$ASSET_NAME"

          echo "DIRECT DOWNLOAD (v$APP_VER): $DIRECT_URL"
          echo "LATEST DOWNLOAD LINK       : $LATEST_URL"
          echo "### 🚀 Game Turbo v$APP_VER Download" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download:** [$ASSET_NAME]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Link:** [$ASSET_NAME]($LATEST_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact:** Game-Turbo-v$APP_VER" >> $GITHUB_STEP_SUMMARY
