name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: read_version
        run: |
          echo "=== Step 1: Reading APP_VERSION from version.properties ==="
          if [ ! -f "version.properties" ]; then
            echo "::error::Missing version.properties file in repository root!"
            exit 1
          fi

          APP_VERSION=$(grep -E '^APP_VERSION=' version.properties | cut -d '=' -f 2 | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            echo "::error::APP_VERSION not found or empty in version.properties!"
            exit 1
          fi

          if ! [[ "$APP_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APP_VERSION '$APP_VERSION' is not a valid positive integer!"
            exit 1
          fi

          echo "Detected APP_VERSION: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: |
          echo "=== Step 2: Compiling Debug APK ==="
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify_apk
        run: |
          echo "=== Step 3: Verifying Built APK(s) ==="
          OUTPUT_DIR="app/build/outputs/apk/debug"
          APK_COUNT=0
          FAILED=0
          PRIMARY_APK=""

          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            APK_COUNT=$((APK_COUNT + 1))

            if [ ! -f "$apk" ]; then
              echo "::error::File does not exist: $apk"
              FAILED=1
              continue
            fi

            FILE_SIZE=$(stat -c%s "$apk" 2>/dev/null || wc -c < "$apk")
            if [ "$FILE_SIZE" -le 0 ]; then
              echo "::error::APK file $apk is empty (size: $FILE_SIZE bytes)!"
              FAILED=1
              continue
            fi

            SHA256_HASH=$(sha256sum "$apk" | awk '{print $1}')
            echo "----------------------------------------"
            echo "APK File : $apk"
            echo "Size     : $FILE_SIZE bytes"
            echo "SHA-256  : $SHA256_HASH"
            echo "----------------------------------------"

            if [ -z "$PRIMARY_APK" ]; then
              PRIMARY_APK="$apk"
            fi
          done < <(find "$OUTPUT_DIR" -type f -name "*.apk" 2>/dev/null)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK files found in $OUTPUT_DIR!"
            echo "=== Directory listing of app/build/outputs/apk ==="
            ls -R app/build/outputs/apk || true
            exit 1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more APK files failed verification!"
            echo "=== Directory listing of app/build/outputs/apk ==="
            ls -R app/build/outputs/apk || true
            exit 1
          fi

          echo "apk_path=$PRIMARY_APK" >> $GITHUB_OUTPUT
          echo "SUCCESS: Verified $APK_COUNT APK file(s) successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Turbo-v${{ steps.read_version.outputs.app_version }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Step 4: Preparing Release Asset ==="
          APP_VER="${{ steps.read_version.outputs.app_version }}"
          SOURCE_APK="${{ steps.verify_apk.outputs.apk_path }}"
          TARGET_NAME="Game-Turbo-v${APP_VER}-debug.apk"
          TEMP_RELEASE_DIR=$(mktemp -d)
          TARGET_PATH="$TEMP_RELEASE_DIR/$TARGET_NAME"

          cp "$SOURCE_APK" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "::error::Failed to prepare debug release asset at $TARGET_PATH"
            exit 1
          fi

          echo "Prepared asset at: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$TARGET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Step 5: Publishing Debug Asset to GitHub Releases ==="
          APP_VER="${{ steps.read_version.outputs.app_version }}"
          RELEASE_TAG="v$APP_VER-debug"
          RELEASE_TITLE="Game Turbo v$APP_VER (Debug Build #${{ github.run_number }})"
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Release asset $ASSET_FILE is invalid."
            exit 1
          fi

          NOTES=$(cat <<EOF
          ### Game Turbo v$APP_VER Debug Build
          - **Build System:** GitHub Actions
          - **Version:** v$APP_VER
          - **Run Number:** #${{ github.run_number }}
          - **Source Commit:** ${{ github.sha }}
          - **Signing:** Debug Keystore (For development and testing only)
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --prerelease || gh release upload "$RELEASE_TAG" "$ASSET_FILE" --clobber

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Step 6: APK Summary Report ==="
          APP_VER="${{ steps.read_version.outputs.app_version }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="v$APP_VER-debug"
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$ASSET_NAME"
            echo "DIRECT APK DOWNLOAD URL: $DIRECT_URL"
            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "[$DIRECT_URL]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The GitHub Actions artifact **Game-Turbo-v${APP_VER}-debug** is also preserved." >> $GITHUB_STEP_SUMMARY
          else
            echo "Notice: GitHub Release creation was skipped or completed with notice."
            echo "### APK BUILD ARTIFACT" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK artifact **Game-Turbo-v${APP_VER}-debug** is available on the workflow run page." >> $GITHUB_STEP_SUMMARY
          fi
