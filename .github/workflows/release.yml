name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Version and Tag Match
        id: verify_version
        run: |
          echo "=== Step 1: Validating version.properties and tag ==="
          if [ ! -f "version.properties" ]; then
            echo "::error::Missing version.properties file in repository root!"
            exit 1
          fi

          # Extract APP_VERSION from version.properties
          APP_VERSION=$(grep -E '^APP_VERSION=' version.properties | cut -d '=' -f 2 | tr -d '[:space:]')

          if [ -z "$APP_VERSION" ]; then
            echo "::error::APP_VERSION not found or empty in version.properties!"
            exit 1
          fi

          # Ensure APP_VERSION is a positive integer
          if ! [[ "$APP_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APP_VERSION '$APP_VERSION' is not a valid positive integer!"
            exit 1
          fi

          EXPECTED_TAG="v$APP_VERSION"
          PUSHED_TAG="${GITHUB_REF#refs/tags/}"

          echo "Detected APP_VERSION : $APP_VERSION"
          echo "Expected git tag     : $EXPECTED_TAG"
          echo "Pushed git tag       : $PUSHED_TAG"

          if [ "$PUSHED_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Pushed tag '$PUSHED_TAG' does not match version.properties APP_VERSION ('$EXPECTED_TAG')! Tag mismatch rejected."
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "release_title=Game Turbo v$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Decode and Validate Release Keystore
        id: keystore_prep
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Step 2: Validating Release Keystore and Secrets ==="
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Required secret 'KEYSTORE_BASE64' is missing in repository secrets!"
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Required secret 'STORE_PASSWORD' is missing in repository secrets!"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required secret 'KEY_PASSWORD' is missing in repository secrets!"
            exit 1
          fi

          KEYSTORE_DIR=$(mktemp -d)
          KEYSTORE_PATH="$KEYSTORE_DIR/release-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode KEYSTORE_BASE64 or resultant keystore file is empty!"
            exit 1
          fi

          echo "Keystore decoded successfully to $KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore_prep.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "=== Step 3: Compiling Release APK with Gradle ==="
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK Output
        id: find_apk
        run: |
          echo "=== Step 4: Verifying Release APK Output ==="
          APP_VER="${{ steps.verify_version.outputs.app_version }}"
          OUTPUT_DIR="app/build/outputs/apk/release"
          APK_COUNT=0
          FAILED=0
          PRIMARY_APK=""

          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            APK_COUNT=$((APK_COUNT + 1))

            if [ ! -f "$apk" ]; then
              echo "::error::File does not exist: $apk"
              FAILED=1
              continue
            fi

            FILE_SIZE=$(stat -c%s "$apk" 2>/dev/null || wc -c < "$apk")
            if [ "$FILE_SIZE" -le 0 ]; then
              echo "::error::Release APK file $apk is empty (size: $FILE_SIZE bytes)!"
              FAILED=1
              continue
            fi

            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "::error::Release APK file $apk is suspiciously small ($FILE_SIZE bytes)!"
              FAILED=1
              continue
            fi

            SHA256_HASH=$(sha256sum "$apk" | awk '{print $1}')
            echo "----------------------------------------"
            echo "Release APK : $apk"
            echo "Size        : $FILE_SIZE bytes"
            echo "SHA-256     : $SHA256_HASH"
            echo "----------------------------------------"

            if [ -z "$PRIMARY_APK" ]; then
              PRIMARY_APK="$apk"
            fi
          done < <(find "$OUTPUT_DIR" -type f -name "*.apk" 2>/dev/null)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No release APK files found in $OUTPUT_DIR!"
            echo "=== Directory listing of app/build/outputs/apk ==="
            ls -R app/build/outputs/apk || true
            exit 1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more release APK files failed verification!"
            echo "=== Directory listing of app/build/outputs/apk ==="
            ls -R app/build/outputs/apk || true
            exit 1
          fi

          # Target asset name: Game-Turbo-v<APP_VERSION>.apk
          ASSET_NAME="Game-Turbo-v${APP_VER}.apk"
          ASSET_PATH="$OUTPUT_DIR/$ASSET_NAME"

          if [ "$PRIMARY_APK" != "$ASSET_PATH" ]; then
            echo "Copying $PRIMARY_APK to $ASSET_PATH for standardized release asset naming..."
            cp "$PRIMARY_APK" "$ASSET_PATH"
          fi

          echo "apk_asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "apk_asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "SUCCESS: Verified $APK_COUNT release APK file(s) successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.verify_version.outputs.release_title }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.find_apk.outputs.apk_asset_path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
